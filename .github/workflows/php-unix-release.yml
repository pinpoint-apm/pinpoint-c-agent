name: PHP Unix binary packages

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      release-tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Upload binaries to the existing PHP source and numeric releases
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/php-unix-release.yml
      - .github/workflows/release.yml
      - scripts/build_php_binary.sh
      - scripts/check_php_binary.php
      - scripts/package_php.sh
      - composer.json
      - config.m4
      - pinpoint_php.cpp
      - php_pinpoint_php.h
      - common/**

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Verify synchronized metadata and release tags
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.release-tag }}
          PUBLISH: ${{ inputs.publish || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^#define PHP_PINPOINT_PHP_VERSION "\([^"]*\)"/\1/p' php_pinpoint_php.h)
          COMPOSER_VERSION=$(python3 -c 'import json; print(json.load(open("composer.json"))["version"])')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$VERSION" != "$COMPOSER_VERSION" ]; then
            echo "::error::PHP header and Composer release versions must agree"
            exit 1
          fi
          RELEASE_TAG="php/v$VERSION"
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$RELEASE_TAG" ]; then
            echo "::error::Requested release tag does not match PHP metadata"
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then
            for TAG in "$RELEASE_TAG" "$VERSION"; do
              gh release view "$TAG" >/dev/null
              TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
              if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
                echo "::error::Tag $TAG does not match the checked-out source"
                exit 1
              fi
            done
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        ts: [nts, ts]
        target:
          - linux-glibc-x64
          - linux-glibc-arm64
          - linux-musl-x64
          - linux-musl-arm64
          - macos-x64
          - macos-arm64
        include:
          - target: linux-glibc-x64
            runner: ubuntu-24.04
            image-suffix: bookworm
          - target: linux-glibc-arm64
            runner: ubuntu-24.04-arm
            image-suffix: bookworm
          - target: linux-musl-x64
            runner: ubuntu-24.04
            image-suffix: alpine3.23
          - target: linux-musl-arm64
            runner: ubuntu-24.04-arm
            image-suffix: alpine3.23
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - name: Build and verify Linux binaries inside native containers
        if: startsWith(matrix.target, 'linux-')
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          THREAD_SAFETY: ${{ matrix.ts }}
          IMAGE_SUFFIX: ${{ matrix.image-suffix }}
        run: |
          VARIANT=cli
          if [ "$THREAD_SAFETY" = ts ]; then
            VARIANT=zts
          fi
          mkdir -p binary-packages
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/binary-packages:/output" \
            "php:$PHP_VERSION-$VARIANT-$IMAGE_SUFFIX" sh -eu -c '
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache $PHPIZE_DEPS linux-headers
              else
                apt-get update
                apt-get install -y --no-install-recommends libtool
              fi
              sh /source/scripts/build_php_binary.sh /output
              curl -fsSL --retry 5 --connect-timeout 20 --max-time 120 \
                https://github.com/php/pie/releases/download/1.5.5/pie.phar -o /output/pie.phar
            '
          # Repeat PIE selection/loading without installing any build dependencies.
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/binary-packages:/packages:ro" \
            "php:$PHP_VERSION-$VARIANT-$IMAGE_SUFFIX" sh -eu -c '
              php /source/scripts/check_php_binary.php /packages/pie.phar /packages/*.tgz
            '
      - name: Set up macOS PHP development tools
        if: startsWith(matrix.target, 'macos-')
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
        env:
          phpts: ${{ matrix.ts }}
      - name: Build and verify macOS binaries
        if: startsWith(matrix.target, 'macos-')
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          THREAD_SAFETY: ${{ matrix.ts }}
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          php -r '
            $expectedZts = getenv("THREAD_SAFETY") === "ts";
            $version = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
            if ((bool) PHP_ZTS !== $expectedZts || $version !== getenv("PHP_VERSION")) {
                fwrite(STDERR, "PHP runtime does not match the requested matrix entry\n");
                exit(1);
            }
          '
          sh scripts/build_php_binary.sh binary-packages
          curl -fsSL --retry 5 --connect-timeout 20 --max-time 120 \
            https://github.com/php/pie/releases/download/1.5.5/pie.phar -o "$RUNNER_TEMP/pie.phar"
          php scripts/check_php_binary.php "$RUNNER_TEMP/pie.phar" binary-packages/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: php-unix-${{ matrix.php-version }}-${{ matrix.ts }}-${{ matrix.target }}
          path: binary-packages/*.tgz
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish == true }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: php-unix-*
          path: unix-packages
          merge-multiple: true
      - name: Upload verified Unix binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          PACKAGES=(unix-packages/php_pinpoint_php-*.tgz)
          if [ "${#PACKAGES[@]}" -ne 36 ]; then
            echo "::error::Expected all 36 Unix packages before publishing"
            exit 1
          fi
          (cd unix-packages && sha256sum *.tgz > SHA256SUMS-unix.txt)
          gh release upload "$RELEASE_TAG" "${PACKAGES[@]}" unix-packages/SHA256SUMS-unix.txt --clobber
          gh release upload "$VERSION" "${PACKAGES[@]}" unix-packages/SHA256SUMS-unix.txt --clobber
