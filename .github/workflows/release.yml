name: release php package

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Name the source archive after the ref selected for this manual release.
  MODULE_PAK: pinpoint_php@${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.php-version.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve synchronized PHP version
        id: php-version
        run: |
          VERSION=$(grep -oP '#define PHP_PINPOINT_PHP_VERSION "\K[^"]+' php_pinpoint_php.h)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve synchronized PHP version"
            exit 1
          fi
          echo "RELEASE_TAG=php/v$VERSION" >> "$GITHUB_ENV"
          echo "release-tag=php/v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: php/v$VERSION"
      - name: Package pinpoint_php
        id: pack
        run: |
          tar -czf ${{ env.MODULE_PAK }} common/ pinpoint_php.cpp php_pinpoint_php.h config.m4 tests LICENSE CHANGES-PHP.md
          md5=($(md5sum ${{ env.MODULE_PAK }} ))
          PACK_NAME=${{ env.MODULE_PAK }}-${md5}-$(date '+%Y-%m-%d').tar.gz
          mv ${{ env.MODULE_PAK }} $PACK_NAME
          echo "PACK=$PACK_NAME" >> $GITHUB_OUTPUT
      - name: Release php_package
        id: rel_php_pak
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.pack.outputs.PACK }}

      - name: generate install_pinpoint_php.sh
        run: |
          PACK_URL=${{ fromJSON(steps.rel_php_pak.outputs.assets)[0].browser_download_url }}
          ## replace __PACK_URL__
          sed -ie "s|__PACK_URL__|${PACK_URL}|g"  install_pinpoint_php.sh

      - name: Release install_pinpoint_php
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: install_pinpoint_php.sh
  
      - name: pack pinpoint-common
        run: |
          tar zcvf pinpoint-common.tar.gz common
      
      - name: Release pinpoint-common
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: pinpoint-common.tar.gz

  windows:
    needs: build
    uses: ./.github/workflows/php-windows-release.yml
    with:
      source-ref: ${{ github.sha }}
      release-tag: ${{ needs.build.outputs.release-tag }}
      publish: true
