name: release php package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve synchronized PHP version
        run: |
          VERSION=$(grep -oP '#define PHP_PINPOINT_PHP_VERSION "\K[^"]+' php_pinpoint_php.h)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve synchronized PHP version"
            exit 1
          fi
          echo "RELEASE_TAG=php/v$VERSION" >> "$GITHUB_ENV"
          echo "MODULE_PAK=pinpoint_php-$VERSION.tar.gz" >> "$GITHUB_ENV"
          echo "Resolved release tag: php/v$VERSION"
      - name: Validate release packages before publishing
        run: |
          docker run --rm -v "$PWD:/source:ro" php:8.3-cli sh /source/scripts/check_php_packages.sh
      - name: Package pinpoint_php
        id: pack
        run: |
          sh scripts/package_php.sh "$MODULE_PAK"
          md5=$(md5sum "$MODULE_PAK" | cut -d ' ' -f1)
          PACK_NAME="${MODULE_PAK%.tar.gz}-${md5}-$(date '+%Y-%m-%d').tar.gz"
          mv "$MODULE_PAK" "$PACK_NAME"
          echo "PACK=$PACK_NAME" >> $GITHUB_OUTPUT
      - name: Create Composer-compatible PHP tag
        env:
          PHP_COMMIT: ${{ github.sha }}
        run: |
          VERSION=${RELEASE_TAG#php/v}
          # Both names must describe this exact source revision. Never move tags.
          for TAG in "$RELEASE_TAG" "$VERSION"; do
            if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
              if [ "$TAG_COMMIT" != "$PHP_COMMIT" ]; then
                echo "::error::Tag $TAG already points to another commit; bump the PHP version."
                exit 1
              fi
            fi
          done
          if ! git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION" "$PHP_COMMIT"
            git push origin "refs/tags/$VERSION"
          fi
      - name: Release php_package
        id: rel_php_pak
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pack.outputs.PACK }}

      - name: generate install_pinpoint_php.sh
        run: |
          PACK_URL=${{ fromJSON(steps.rel_php_pak.outputs.assets)[0].browser_download_url }}
          ## replace __PACK_URL__
          sed -ie "s|__PACK_URL__|${PACK_URL}|g"  install_pinpoint_php.sh

      - name: Release install_pinpoint_php
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: install_pinpoint_php.sh
  
      - name: pack pinpoint-common
        run: |
          tar zcvf pinpoint-common.tar.gz common
      
      - name: Release pinpoint-common
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: pinpoint-common.tar.gz
