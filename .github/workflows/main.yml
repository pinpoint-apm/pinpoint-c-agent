name: CI

on: 
  pull_request:
    # Changes under testapps/ are local integration-test helpers and do not
    # trigger CI. Only source changes should run the pipeline.
    paths-ignore:
      - 'testapps/**'
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  MODULE_PAK: pinpoint_php-${{ github.head_ref || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Detect which components changed so downstream jobs can be skipped.
  # Each component maps to the source paths that own it. The `common/`
  # core is shared by BOTH the PHP and Python agents, so a change there
  # must also trigger the PHP and Python test jobs.
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      php: ${{ steps.filter.outputs.php }}
      python: ${{ steps.filter.outputs.python }}
      collector: ${{ steps.filter.outputs.collector }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      # Only compute path filters on pull requests. On push (tags) and
      # workflow_dispatch the downstream jobs always run (their `if`
      # conditions short-circuit via `github.event_name != 'pull_request'`),
      # so the filter outputs are not needed there.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'some'
          filters: |
            cpp:
              - 'common/**'
              - 'src/CPP/**'
            php:
              - 'pinpoint_php.cpp'
              - 'php_pinpoint_php.h'
              - 'config.m4'
              - 'config.w32'
              - 'package.xml'
              - 'composer.json'
              - 'pinpoint_php_files.txt'
              - 'tests/**'
              - 'tests_macos/**'
              - 'tests_win32/**'
              - 'plugins/PHP/**'
            python:
              - 'src/PY/**'
              - 'setup.py'
              - 'setup_pypi_test.py'
              - 'MANIFEST.in'
              - 'plugins/PY/**'
            collector:
              - 'collector-agent/**'

  cpp:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: actions-setup-cmake
        uses: jwlawson/actions-setup-cmake@v1.6
        with:
          cmake-version: "3.16.x"
      - name: Build agent
        run: |
          cd common
          mkdir -p build
          cd build
          cmake -DWITH_TEST_CASE=1 -DWITH_CODECOVERAGE=1 -DCMAKE_BUILD_TYPE=Debug  .. 
          make
          ./bin/TestCommon
      - name: Codecovage
        uses: codecov/codecov-action@v4

  cpp-windows:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true'
    runs-on: [windows-latest]
    steps:
      - uses: actions/checkout@v2

      - name: powershell allow...
        shell: cmd
        run: powershell -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser"

      - name: Build agent
        run: |
          cd common
          cmake --no-warn-unused-cli -DWITH_TEST_CASE=1 -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -S. -B./build -G "Visual Studio 18 2026" -T host=x86 -A win32
          cmake --build build --target ALL_BUILD --config debug --
          ./build/bin/Debug/TestCommon.exe

  memory-leak:
    needs: [changes, cpp, cpp-windows]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: actions-setup-cmake
        uses: jwlawson/actions-setup-cmake@v1.6
        with:
          cmake-version: "3.16.x"
      - name: Build agent
        run: |
          sudo apt update || echo "update failed,but try to overlook it"
          sudo apt install -y valgrind -y valgrind
          cd common
          mkdir -p build
          cd build
          cmake -DWITH_TEST_CASE=1 -DCMAKE_BUILD_TYPE=Debug  .. 
          make
          valgrind --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --verbose \
            --log-file=valgrind-out.txt \
            ./bin/TestCommon
      - name: Archive docs
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-out
          path: common/build/valgrind-out.txt
          retention-days: 5
          if-no-files-found: error

  PHP:
    runs-on: ubuntu-latest
    needs: [changes, cpp]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true' ||
      needs.changes.outputs.php == 'true'
    strategy:
      matrix:
        php-version: ["7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: update docker compose
        run: |
          wget "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
          chmod +x docker-compose-linux-x86_64
          ./docker-compose-linux-x86_64 version
      - name: start test environment
        run: |
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" build php-compatible  --build-arg PHP_VERSION=${{ matrix.php-version }}
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" up php-compatible
      - name: Stop containers
        # if: always()
        run: ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" down php-compatible

  PHP-MacOS:
    runs-on: macos-latest
    needs: [changes, cpp]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true' ||
      needs.changes.outputs.php == 'true'
    strategy:
      matrix:
        php-version: ["7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3"]
        ts: ["ts","nts"]
    env:
      SKIP_MACOS_ACTION: true        
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
        env:
          phpts: ${{ matrix.ts }}
      - name: build pinpoint_php
        run:  phpize && ./configure && make 
      - name: make test      
        run: make test TESTS="--show-diff tests_macos"

  PHP-Win-2019:
    runs-on: windows-2019
    needs: [changes, cpp-windows]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true' ||
      needs.changes.outputs.php == 'true'
    env:
      SKIP_WINDOWS_ACTION: true
    strategy:
      matrix:
        php-versions: [ "7.4", "7.3", "7.2","7.1","8.0", "8.1", "8.2", "8.3"]
        arch: [ "x64"]
        ts: [ "ts", "nts" ]
    steps:
      - uses: actions/checkout@v2
      - id: setup-php-sdk
        uses: php/setup-php-sdk@v0.10
        with:
          version: ${{ matrix.php-versions }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
          toolset: ${{steps.setup-php-sdk.outputs.toolset}}

      - name: build pinpoint_php on windows
        run: |
          php -m
          php -v
          mkdir output
          phpize
          ./configure.bat --enable-pinpoint_php --enable-debug-pack --enable-object-out-dir=output --with-prefix=${{steps.setup-php-sdk.outputs.prefix}}
          nmake

      - name: test pinpoint_php on windows      
        run: |
          # from https://github.com/php/setup-php-sdk/issues/7
          nmake test TESTS="--show-diff tests_win32"
          echo "pinpoint_php_win32_pack_name=${{ env.MODULE_PAK }}-${{ matrix.php-versions }}-${{ matrix.ts }}-${{steps.setup-php-sdk.outputs.vs}}-${{ matrix.arch }}" | Out-File -FilePath $env:GITHUB_ENV -Append 

      - name: package
        run: |
          mkdir _package_
          if (Test-Path -Path output/Release/ -PathType Container) {
              cp output/Release/php_pinpoint_php.dll _package_
              cp output/Release/php_pinpoint_php.pdb _package_
              cp output/Release/php_pinpoint_php.lib _package_
          } 

          if (Test-Path -Path output/Release_TS/ -PathType Container) {
              cp output/Release_TS/php_pinpoint_php.dll _package_
              cp output/Release_TS/php_pinpoint_php.pdb _package_
              cp output/Release_TS/php_pinpoint_php.lib _package_
          } 

          cp NOTICE _package_
          cp README.md _package_
          cp CHANGES-PHP.md _package_
          cp LICENSE _package_
          Compress-Archive -Path _package_/*   ${{ env.pinpoint_php_win32_pack_name }}.zip 
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.pinpoint_php_win32_pack_name }}
          path: ${{ env.pinpoint_php_win32_pack_name }}.zip 
          retention-days: 5
          if-no-files-found: error

  PHP-Release-Win32-Package:
    needs: [ PHP-Win-2019, pack_php_module]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          path: pinpoint-artifact
          pattern: pinpoint_php*
          merge-multiple: true
      - run: ls -R pinpoint-artifact

      - name: Release php_package
        id: rel_php_pak
        uses: softprops/action-gh-release@v2
        with:
          files: pinpoint-artifact/*

  pack_php_module:
    runs-on: ubuntu-latest
    needs: [changes, PHP]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true' ||
      needs.changes.outputs.php == 'true'
    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP without composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: pecl package
        run: |
          pecl package
          pecl build

      # - name: Package pinpoint_php
      #   id: pack
      #   run: |
      #     tar -czf ${{ env.MODULE_PAK }} common/ config.m4 tests LICENSE pinpoint_php.cpp php_pinpoint_php.h
      #     md5=($(md5sum ${{ env.MODULE_PAK }} ))
      #     pinpoint_php_win32_pack_name=${{ env.MODULE_PAK }}-${md5}-$(date '+%Y-%m-%d').tar.gz
      #     mv ${{ env.MODULE_PAK }} $pinpoint_php_win32_pack_name
      #     echo "PACK=$pinpoint_php_win32_pack_name" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: pinpoint_php.tgz
          path: pinpoint_php*.tgz
          retention-days: 5
          if-no-files-found: error

  Python:
    needs: [changes, cpp, cpp-windows]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true' ||
      needs.changes.outputs.python == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13]
        python-version: ["3.9", "3.10", "3.11","3.12","3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: run unittest
        run: |
          # ref https://github.com/pypa/setuptools/issues/3198
          pip install -e .
          python -m unittest discover -s src/PY/test

  python-plugins:
    needs: [changes, Python]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.cpp == 'true' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: update docker compose
        run: |
          wget "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
          chmod +x docker-compose-linux-x86_64
          ./docker-compose-linux-x86_64 version
        # run: docker-compose  -f "testapps/compose.yaml" build python-plugins
      # - name: build python-plugins
      - name: start test environment
        run: |
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" up py3.9-plugins --exit-code-from py3.9-plugins
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" up py-plugins --exit-code-from py-plugins
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" up py3.11-plugins --exit-code-from py3.11-plugins
      - name: Stop containers
        # if: always()
        run: ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" down py3.11-plugins py-plugins py3.9-plugins 

  Collector-agent:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.collector == 'true'
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest,windows-latest,macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go-version }}
          
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: "true"

      - name: Setup protoc
        uses: arduino/setup-protoc@v2.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run unittest
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd collector-agent && make test
