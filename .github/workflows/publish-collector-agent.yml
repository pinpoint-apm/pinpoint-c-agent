name: publish-collector-agent

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/collector-agent

jobs:
  collector-agent: # reference from https://docs.docker.com/build/ci/github-actions/multi-platform/
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v2
        with:
          submodules: "true"          
      
      # The version is defined once in code (collector-agent/server/Server.go).
      # Read it from there instead of hardcoding it here.
      - name: Resolve version from source
        run: |
          VERSION=$(grep -oP 'var Version = "\K[^"]+' collector-agent/server/Server.go)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve server.Version from collector-agent/server/Server.go"
            exit 1
          fi
          echo "TAG_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v7
          push: true
          context: collector-agent
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  Release-Collector-agent:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows]
        goarch: [amd64]
    steps:
    - name: Show environment
      run: export
    - uses: actions/checkout@v2
      with:
        submodules: "true"
    # The generated protobuf Go code under pinpoint-grpc-idl-go/proto/v1 is NOT
    # committed (see collector-agent/.gitignore); regenerate it here so the
    # release build has the v1 package available.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.1"
    - name: Install protoc and plugins
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33.0
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Generate protobuf Go code
      working-directory: collector-agent
      run: make protoc
    # The version is defined once in code (collector-agent/server/Server.go).
    # Do NOT override server.Version via -ldflags; the binary must report the
    # version that is actually compiled into the source.
    - name: Resolve version from source
      run: |
        VERSION=$(grep -oP 'var Version = "\K[^"]+' collector-agent/server/Server.go)
        if [ -z "$VERSION" ]; then
          echo "::error::Could not resolve server.Version from collector-agent/server/Server.go"
          exit 1
        fi
        echo "TAG_NAME=$VERSION" >> "$GITHUB_ENV"
        echo "Resolved version: $VERSION"
    - uses: wangyoucao577/go-release-action@v1
      id: release-ca
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goversion: 1.27.1
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        project_path: "collector-agent"
        binary_name: "collector-agent"
        extra_files: LICENSE collector-agent/CHANGES.md 