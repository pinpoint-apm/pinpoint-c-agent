name: publish-collector-agent

on:
  workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/collector-agent

jobs:
  collector-agent: # reference from https://docs.docker.com/build/ci/github-actions/multi-platform/
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v2
        with:
          submodules: "true"          
      
      # DO NOT Change it by hand, it managed by CI(sync-component-versions)
      - name: Resolve synchronized collector-agent version
        run: |
          VERSION=$(make -s -C collector-agent print-version)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve synchronized collector-agent version"
            exit 1
          fi
          echo "TAG_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          context: .
          file: collector-agent/Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
