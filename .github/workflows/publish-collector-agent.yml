name: publish-collector-agent

on:
  workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/collector-agent

jobs:
  collector-agent: # reference from https://docs.docker.com/build/ci/github-actions/multi-platform/
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v2
        with:
          submodules: "true"          
      
      # The version is defined once in repo-root versions.json (the single
      # source of truth for all products). Read it from there.
      - name: Resolve version from source
        run: |
          VERSION=$(grep -oP '"collector-agent": *"\K[^"]+' versions.json)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve collector-agent version from versions.json"
            exit 1
          fi
          echo "TAG_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          context: .
          file: collector-agent/Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}