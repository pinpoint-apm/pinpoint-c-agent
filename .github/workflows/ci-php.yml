name: CI-php

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  PHP:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.2","8.3"]
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: update docker compose
        run: |
          wget "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
          chmod +x docker-compose-linux-x86_64
          ./docker-compose-linux-x86_64 version
      - name: start test environment
        run: |
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" build php-compatible  --build-arg PHP_VERSION=${{ matrix.php-version }}
          ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" up php-compatible
      - name: Stop containers
        # if: always()
        run: ./docker-compose-linux-x86_64 -f "testapps/compose.yaml" down php-compatible

  PHP-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["7.1", "7.4", "8.0", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test extracted PECL and GitHub packages
        run: |
          docker run --rm -v "$PWD:/source:ro" \
            "php:${{ matrix.php-version }}-cli" \
            sh /source/scripts/check_php_packages.sh

  PHP-PIE:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Download PIE and Composer
        run: |
          curl -fsSL https://github.com/php/pie/releases/download/1.5.5/pie.phar -o /tmp/pie.phar
          curl -fsSL https://getcomposer.org/download/2.11.1/composer.phar -o /tmp/composer.phar
      - name: Verify Composer discovery and PIE installation
        run: sh scripts/check_php_pie.sh /tmp/composer.phar /tmp/pie.phar

  PHP-MacOS:
    if: false # skip: macOS PHP build is currently flaky/unsupported
    runs-on: macos-latest
    strategy:
      matrix:
        php-version: ["8.2","8.3"]
        ts: ["ts","nts"]
    env:
      SKIP_MACOS_ACTION: true        
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
        env:
          phpts: ${{ matrix.ts }}
      - name: build pinpoint_php
        run:  phpize && ./configure && make 
      - name: make test      
        run: make test TESTS="--show-diff tests_macos"

  PHP-Win-2022:
    runs-on: windows-2022
    strategy:
      matrix:
        php-versions: [ "8.2", "8.3"]
        arch: [ "x64"]
        ts: [ "ts", "nts" ]
    env:
      SKIP_WINDOWS_ACTION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and test pinpoint_php on Windows
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-versions }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-pinpoint_php
          run-tests: true
          test-runner: run-tests.php
          test-runner-args: --show-diff tests_win32

  pack_php_module:
    runs-on: ubuntu-latest
    needs: PHP
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP without composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Package pinpoint_php
        run: |
          pecl package
          pecl build

      - uses: actions/upload-artifact@v4
        with:
          name: pinpoint_php.tgz
          path: pinpoint_php*.tgz
          retention-days: 5
          if-no-files-found: error
