name: check-version-consistency

# Guard against version drift: versions.json is the single source of truth.
# This job fails if any product's version is hardcoded somewhere that disagrees
# with versions.json (e.g. someone edits setup.py or php_pinpoint_php.h by hand
# instead of bumping versions.json).

on:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify versions.json is valid JSON
        run: |
          python3 -c 'import json,sys; json.load(open("versions.json"))'

      - name: Verify Python version consistency
        run: |
          EXPECTED=$(python3 -c 'import json; print(json.load(open("versions.json"))["python"])')
          # setup.py reads versions.json at build time, so no hardcoded value to
          # check there. But __init__.py has a hardcoded fallback that must match.
          FALLBACK=$(grep -oP 'return "\K[0-9.]+(?=")' plugins/PY/pinpointPy/__init__.py)
          if [ -n "$FALLBACK" ] && [ "$FALLBACK" != "$EXPECTED" ]; then
            echo "::error::plugins/PY/pinpointPy/__init__.py fallback '$FALLBACK' != versions.json python '$EXPECTED'"
            exit 1
          fi
          echo "Python version consistent: $EXPECTED"

      - name: Verify PHP version consistency
        run: |
          EXPECTED=$(python3 -c 'import json; print(json.load(open("versions.json"))["php"])')
          HEADER=$(grep -oP '#define PHP_PINPOINT_PHP_VERSION "\K[0-9.]+(?=")' php_pinpoint_php.h)
          COMPOSER=$(grep -oP '"version": "\K[0-9.]+(?=")' composer.json)
          if [ "$HEADER" != "$EXPECTED" ]; then
            echo "::error::php_pinpoint_php.h fallback '$HEADER' != versions.json php '$EXPECTED'"
            exit 1
          fi
          if [ "$COMPOSER" != "$EXPECTED" ]; then
            echo "::error::composer.json '$COMPOSER' != versions.json php '$EXPECTED'"
            exit 1
          fi
          echo "PHP version consistent: $EXPECTED"

      - name: Verify common version consistency
        run: |
          EXPECTED=$(python3 -c 'import json; print(json.load(open("versions.json"))["common"])')
          # common.h.in is a template; it must NOT hardcode a version (it uses
          # @PINPOINT_C_AGENT_API_VERSION@). The generated common.h is gitignored.
          if grep -q '#define PINPOINT_C_AGENT_API_VERSION "[0-9.]*"' common/include/common.h.in; then
            echo "::error::common/include/common.h.in hardcodes a version; use @PINPOINT_C_AGENT_API_VERSION@"
            exit 1
          fi
          echo "common version source: versions.json ($EXPECTED)"

      - name: Verify collector-agent version consistency
        run: |
          EXPECTED=$(python3 -c 'import json; print(json.load(open("versions.json"))["collector-agent"])')
          # server/Server.go must NOT hardcode var Version (it is generated into
          # server/version_gen.go by `make version`).
          if grep -q 'var Version = ' collector-agent/server/Server.go; then
            echo "::error::collector-agent/server/Server.go hardcodes var Version; it is generated by 'make version'"
            exit 1
          fi
          echo "collector-agent version source: versions.json ($EXPECTED)"
