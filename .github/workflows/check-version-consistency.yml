name: check-version-consistency

on:
  pull_request:
    branches: ["0.7"]
  push:
    branches: ["0.7"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate collector-agent version file
        run: make -C collector-agent version
      - name: Check synchronized versions
        run: python3 scripts/sync_versions.py --check
      - name: Check generated product histories
        run: python3 scripts/sync_changes.py --check
