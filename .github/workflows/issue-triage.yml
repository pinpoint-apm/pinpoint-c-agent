name: Issue Triage Bot

# Auto-triage new issues with GitHub Models (free, zero config).
#
# Setup: none required. The workflow uses the built-in GITHUB_TOKEN with the
# `models: read` permission to call GitHub Models (https://github.com/marketplace/models).
# Optional override (repo Variable):
#   - GH_MODEL:  GitHub Models model id (default: openai/gpt-4o-mini)
#
# Security notes (public repo):
#   - Issue title/body are UNTRUSTED input. They are passed via env vars (never
#     interpolated into shell), and the prompt treats them as data only.
#   - permissions are minimal: issues:write + models:read. No checkout of
#     untrusted content, no pull_request_target; secrets are not exposed to
#     fork-triggered runs.
#   - The bot comments at most once per issue to avoid spam loops.

on:
  issues:
    # Only trigger on issue creation. Edits/comments do not re-trigger, which
    # avoids extra runs and saves GitHub Models quota.
    types: [opened]

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Skip issues opened by bots (e.g. dependabot) to save quota.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Triage issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODEL: ${{ vars.GH_MODEL || 'openai/gpt-4o-mini' }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python .github/scripts/issue_triage.py
