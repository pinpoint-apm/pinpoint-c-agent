# GitHub Secret Scanning configuration.
#
# This file tells GitHub's secret scanning (both secret scanning alerts and
# push protection) to ignore certain paths.
#
# The `testapps/` directory contains only test/demo code with placeholder
# credentials (e.g. `root:password`, `MYSQL_ROOT_PASSWORD: 'password'`), which
# are intentionally not real secrets. Excluding them avoids false positives.
#
# Reference:
#   https://docs.github.com/en/code-security/secret-scanning/secret-scanning-configurations
paths-ignore:
  - 'testapps/**'
