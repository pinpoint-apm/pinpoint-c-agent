[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "pinpointPy"
description = "The pinpoint Python library"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.8"
keywords = [
    "pinpoint",
]
authors = [
    { name = "cd_pinpoint members", email = "dl_cd_pinpoint@navercorp.com" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    'Programming Language :: Python :: Implementation :: CPython',
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [

]
dynamic = ["version"]

[project.urls]
"Bug Tracker" = "https://github.com/pinpoint-apm/pinpoint-c-agentissues"
Documentation = "https://github.com/pinpoint-apm/pinpoint-c-agent/tree/dev/DOC/PY"
"Source Code" = "https://github.com/pinpoint-apm/pinpoint-c-agent"

[project.scripts]

[tool.cibuildwheel]
# The C extension is built against the Python Stable ABI (abi3), so a single
# cp38-abi3 wheel covers every supported Python (>=3.8) per architecture.
# Build only the lowest supported version once; cibuildwheel tags the wheel
# as cp38-abi3 automatically.
build = "cp38-*"
skip = "pp*"

[tool.hatch.version]

[tool.hatch.build.targets.sdist]
